<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Saltinup</title>
<link rel="stylesheet" href="/static/css/main.css"/>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>"/>
</head>
<body data-theme="dark">

<!-- ══ NOTIFICATION TOAST ══════════════════════════════════════════════════ -->
<div id="notif-toast" class="notif-toast hidden">
  <div class="notif-toast-icon">⏰</div>
  <div class="notif-toast-body">
    <div class="notif-toast-title"></div>
    <div class="notif-toast-msg"></div>
  </div>
  <button class="notif-toast-close" onclick="closeToast()">✕</button>
</div>

<!-- ══ NAVBAR ══════════════════════════════════════════════════════════════ -->
<nav class="navbar" id="navbar">
  <div class="nav-left">
    <span class="logo" onclick="navigate('feed')" id="site-logo">
      <span class="logo-s">S</span><span class="logo-a">a</span><span class="logo-l">l</span><span class="logo-t">t</span><span class="logo-i">i</span><span class="logo-n">n</span><span class="logo-u">u</span><span class="logo-p2">p</span>
    </span>
  </div>
  <div class="nav-center" id="nav-search-wrap">
    <div class="search-box">
      <span>🔍</span>
      <input type="text" id="search-input" placeholder="Foydalanuvchilarni qidiring..." onkeyup="handleSearch(event)"/>
    </div>
    <div class="search-results hidden" id="search-results"></div>
  </div>
  <div class="nav-right" id="nav-right">
    <div class="theme-switcher">
      <button class="theme-btn" data-theme="dark"   onclick="setTheme('dark')"  title="Qora">🌑</button>
      <button class="theme-btn" data-theme="light"  onclick="setTheme('light')" title="Oq">☀️</button>
      <button class="theme-btn" data-theme="blue"   onclick="setTheme('blue')"  title="Ko'k">💙</button>
    </div>
    <div class="nav-notif" onclick="navigate('notifications')" id="nav-notif-btn" style="display:none">
      🔔<span class="notif-badge" id="notif-badge" style="display:none">0</span>
    </div>
    <div class="nav-links" id="nav-links">
      <button class="btn-ghost" onclick="navigate('login')">Kirish</button>
      <button class="btn-primary" onclick="navigate('register')">Ro'yxat</button>
    </div>
    <div class="nav-user hidden" id="nav-user" onclick="navigate('profile')">
      <div class="nav-avatar" id="nav-avatar">?</div>
      <span id="nav-username"></span>
    </div>
  </div>
</nav>

<!-- ══ PAGES ════════════════════════════════════════════════════════════════ -->
<main class="main-content" id="app">

  <!-- ── LOGIN ─────────────────────────────────────────────────────────── -->
  <div id="page-login" class="page hidden">
    <div class="auth-card">
      <div class="auth-logo">⚡ Saltinup</div>
      <h2>Tizimga kirish</h2>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="login-email" placeholder="email@example.com"/>
      </div>
      <div class="form-group">
        <label>Parol</label>
        <input type="password" id="login-pass" placeholder="••••••" onkeydown="if(event.key==='Enter')doLogin()"/>
      </div>
      <div class="form-error" id="login-err"></div>
      <button class="btn-primary w-full" onclick="doLogin()">Kirish</button>
      <p class="auth-link">Hisobingiz yo'qmi? <a onclick="navigate('register')">Ro'yxatdan o'ting</a></p>
    </div>
  </div>

  <!-- ── REGISTER ──────────────────────────────────────────────────────── -->
  <div id="page-register" class="page hidden">
    <div class="auth-card">
      <div class="auth-logo">⚡ Saltinup</div>
      <h2>Ro'yxatdan o'tish</h2>
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="reg-username" placeholder="username"/>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="reg-email" placeholder="email@example.com"/>
      </div>
      <div class="form-group">
        <label>Telefon raqam</label>
        <input type="tel" id="reg-phone" placeholder="+998901234567"/>
      </div>
      <div class="form-group">
        <label>Parol</label>
        <input type="password" id="reg-pass" placeholder="kamida 6 ta belgi"/>
      </div>
      <div class="form-error" id="reg-err"></div>
      <button class="btn-primary w-full" onclick="doRegister()">Ro'yxatdan o'tish</button>
      <p class="auth-link">Hisobingiz bormi? <a onclick="navigate('login')">Kirish</a></p>
    </div>
  </div>

  <!-- ── PROFILE SETUP ─────────────────────────────────────────────────── -->
  <div id="page-profile-setup" class="page hidden">
    <div class="auth-card wide">
      <div class="auth-logo">🎉 Xush kelibsiz!</div>
      <h2>Profilingizni to'ldiring</h2>
      <div class="profile-setup-preview">
        <div class="avatar-upload-wrap">
          <div class="avatar-preview" id="setup-avatar-preview" style="background:#3b82f6">?</div>
          <label class="btn-ghost small" for="setup-avatar-input">📷 Rasm yuklash</label>
          <input type="file" id="setup-avatar-input" accept="image/*" style="display:none" onchange="previewAvatar(this,'setup-avatar-preview')"/>
        </div>
      </div>
      <div class="form-group">
        <label>Username (o'zgartirish)</label>
        <input type="text" id="setup-username" placeholder="username"/>
      </div>
      <div class="form-group">
        <label>Bio</label>
        <textarea id="setup-bio" placeholder="O'zingiz haqingizda..." rows="3"></textarea>
      </div>
      <div class="form-group">
        <label>Profil orqa fon rangi</label>
        <div class="color-picker-row" id="bg-color-picker">
          <div class="color-dot active" style="background:#3b82f6" data-color="#3b82f6" onclick="selectBgColor(this)"></div>
          <div class="color-dot" style="background:#8b5cf6" data-color="#8b5cf6" onclick="selectBgColor(this)"></div>
          <div class="color-dot" style="background:#ec4899" data-color="#ec4899" onclick="selectBgColor(this)"></div>
          <div class="color-dot" style="background:#10b981" data-color="#10b981" onclick="selectBgColor(this)"></div>
          <div class="color-dot" style="background:#f59e0b" data-color="#f59e0b" onclick="selectBgColor(this)"></div>
          <div class="color-dot" style="background:#ef4444" data-color="#ef4444" onclick="selectBgColor(this)"></div>
          <div class="color-dot" style="background:#1e293b" data-color="#1e293b" onclick="selectBgColor(this)"></div>
          <input type="color" id="custom-bg-color" value="#3b82f6" onchange="customBgColor(this)" title="Boshqa rang"/>
        </div>
      </div>
      <button class="btn-primary w-full" onclick="saveProfile()">Saqlash va davom etish</button>
    </div>
  </div>

</main>
<!-- Pages continue in JS rendering -->

<!-- ══ FOOTER ══════════════════════════════════════════════════════════════ -->
<footer class="footer" id="footer">
  <div class="footer-inner">
    <div class="footer-brand">
      <span class="footer-logo">⚡ Saltinup</span>
      <p>Kunlik maqsadlaringizga erishing</p>
    </div>
    <div class="footer-links">
      <a onclick="navigate('feed')">Lenta</a>
      <a onclick="navigate('schedule')">Jadval</a>
      <a onclick="navigate('profile')">Profil</a>
    </div>
    <div class="footer-copy">© 2025 Saltinup. Barcha huquqlar himoyalangan.</div>
  </div>
</footer>

<script src="/static/js/app.js"></script>
</body>
</html>
